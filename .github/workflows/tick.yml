# Calls the bot's /tick on a schedule: wakes the free Render service and runs
# reminders / the weekly digest. Needs repo secrets BOT_URL and TICK_SECRET.
name: tick
on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 h (economy mode; use */10 to keep the bot always awake)
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping /tick
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$BOT_URL" ]; then echo "BOT_URL secret not set yet"; exit 0; fi
          curl -fsS --max-time 90 -H "X-Tick-Secret: $TICK_SECRET" "$BOT_URL/tick" -o /dev/null -w "%{http_code}\n"
