<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Восстановление пароля · NeuralDesk</title><link rel="stylesheet" href="assets/styles.css"></head><body data-page="reset"><header class="nav"><div class="wrap"><a href="index.html" class="logo"><i></i>NeuralDesk</a><nav class="links"><a href="index.html">Главная</a><a href="marketplace.html">Маркетплейс</a><a href="services.html">Внедрение</a><a href="pricing.html">Цены</a></nav><div class="nav-cta"><a class="btn" href="login.html">Войти</a><a class="btn primary" href="register.html">Начать</a><button class="burger" aria-label="Меню">☰</button></div></div></header><main class="auth"><div class="card">
<div data-step="request"><h1>Восстановление пароля</h1><p class="sub">Введите email — мы пришлём ссылку для сброса пароля.</p><div class="alert err" role="alert" hidden></div><div class="alert ok" role="status" hidden></div>
<form novalidate data-form="request"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><button class="btn primary lg" type="submit">Отправить ссылку</button></form></div>
